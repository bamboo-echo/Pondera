name: Release Desktop

# Builds the signed desktop installers for macOS and Linux and publishes one
# immutable GitHub release. macOS artifacts are signed with a Developer ID and
# notarized when the APPLE_* secrets are configured; without them the build
# falls back to an ad-hoc signature so forks can still produce artifacts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v1.2.3"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [stable]
        default: stable
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release identity
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - name: Require a protected main checkout
        env:
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Desktop releases must be dispatched from main, got $REF" >&2
            exit 1
          fi
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Desktop releases must be dispatched from a protected branch" >&2
            exit 1
          fi

      - name: Validate the requested version
        id: identity
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Version must be a v-prefixed semantic version, got: $VERSION" >&2
            exit 1
          fi
          if [ "$CHANNEL" != "stable" ]; then
            echo "Unsupported channel: $CHANNEL" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            slug: darwin-arm64
            runner: macos-14
          - target: darwin/amd64
            slug: darwin-amd64
            runner: macos-15-intel
          - target: darwin/universal
            slug: darwin-universal
            runner: macos-14
          - target: linux/amd64
            slug: linux-amd64
            runner: ubuntu-24.04
          - target: linux/arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Install desktop workspace dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install nfpm
        if: startsWith(matrix.target, 'linux/')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Import the Developer ID certificate
        if: startsWith(matrix.target, 'darwin/') && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/pondera-signing.keychain-db"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "HAS_APPLE_CERT=true" >> "$GITHUB_ENV"

      - name: Prepare the notarization API key
        if: startsWith(matrix.target, 'darwin/') && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build and package ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/desktop-build.sh "${{ matrix.target }}" "${{ needs.resolve.outputs.tag }}" "${{ inputs.channel }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the desktop release
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Generate the desktop update manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd desktop
          go run ./cmd/sign manifest ../dist "${{ needs.resolve.outputs.tag }}" "${{ needs.resolve.outputs.tag }}"

      - name: Write release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "Pondera Desktop $VERSION"
            echo
            echo "Built from $SHA."
            echo
            echo "macOS: drag-to-Applications disk image, notarized when signing secrets are configured."
            echo "Linux: Debian package and portable tarball for amd64 and arm64."
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-desktop-github-release.sh \
            "${{ needs.resolve.outputs.tag }}" \
            "${{ needs.resolve.outputs.version }}" \
            "${{ needs.resolve.outputs.prerelease }}" \
            "$RUNNER_TEMP/notes.md" \
            dist
