name: Release Desktop

# Reusable workflow contract: release-{1}.yml documents the single protected
# entrypoint that may call this workflow.

# Immutable Desktop release control plane. The workflow is dispatched from the
# protected main-v2 branch and checks out the product at one resolved candidate
# SHA. Signing, packaging and publication all revalidate that same commit before
# any pointer moves.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [stable]
        default: stable
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        type: boolean
        default: false
      orchestrator:
        description: "Name of the orchestrating release workflow"
        required: false
        type: string
        default: ""
      orchestrated:
        description: "The orchestrator already resolved the candidate"
        required: false
        type: boolean
        default: false
      approved_sha:
        description: "Orchestrator-approved product commit"
        required: false
        type: string
        default: ""
      approved_cli_tag:
        description: "Orchestrator-approved CLI tag for the manifest notes"
        required: false
        type: string
        default: ""
      candidate_control_sha:
        description: "Protected control-plane commit for candidate verification"
        required: false
        type: string
        default: ""
      candidate_preparation:
        description: "Prepare a candidate without activating a release tag"
        required: false
        type: boolean
        default: false
      candidate_verified:
        description: "The candidate attestations and assets were verified"
        required: false
        type: boolean
        default: false
      preflight_artifact_prefix:
        description: "Artifact prefix for a Windows preflight build"
        required: false
        type: string
        default: ""
      reuse_manual_artifacts:
        description: "Recover the protected manual producer artifacts"
        required: false
        type: boolean
        default: false
      desktop_manual_only:
        description: "Manual-download only: skip Windows Authenticode"
        required: false
        type: boolean
        default: false
      signing_preflight:
        description: "Only validate the signing contract"
        required: false
        type: boolean
        default: false
      signing_preflight_verified:
        description: "The orchestrator verified the signing preflight"
        required: false
        type: boolean
        default: false
      production_signing_smoke:
        description: "Run the production signing smoke instead of a full release"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: false
        type: string
        default: stable
      prerelease:
        required: false
        type: boolean
        default: false
      orchestrator:
        required: false
        type: string
        default: ""
      orchestrated:
        required: false
        type: boolean
        default: true
      approved_sha:
        required: false
        type: string
        default: ""
      approved_cli_tag:
        required: false
        type: string
        default: ""
      candidate_control_sha:
        required: false
        type: string
        default: ""
      candidate_preparation:
        required: false
        type: boolean
        default: false
      candidate_verified:
        required: false
        type: boolean
        default: false
      reuse_manual_artifacts:
        required: false
        type: boolean
        default: false
      desktop_manual_only:
        required: false
        type: boolean
        default: false
      signing_preflight:
        required: false
        type: boolean
        default: false
      signing_preflight_verified:
        required: false
        type: boolean
        default: false
      production_signing_smoke:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ (inputs.channel == 'preview' || inputs.channel == 'canary') && 'preview' || 'stable' }}
  cancel-in-progress: false

env:
  IN_ORCHESTRATOR: ${{ inputs.orchestrator }}
  HAS_CERTUM: ${{ secrets.CERTUM_USERNAME != '' && secrets.CERTUM_OTP_URI != '' && secrets.CERTUM_KEY_ID != '' && !inputs.desktop_manual_only }}

jobs:
  resolve:
    name: Resolve the immutable candidate
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      channel: ${{ steps.candidate.outputs.channel }}
      artifact_prefix: ${{ steps.candidate.outputs.artifact_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: bamboo-echo/Pondera
          ref: ${{ inputs.candidate_control_sha || github.workflow_sha }}
          path: release-control

      - name: Verify the protected dispatch
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Desktop releases must run from a protected branch" >&2
            exit 1
          fi
          echo "workflow=$WORKFLOW_REF"
          bash scripts/verify-release-tag.sh "${{ inputs.version }}" "${{ github.sha }}"

      - name: Resolve the protected Desktop candidate
        id: candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          IN_ORCHESTRATOR: ${{ inputs.orchestrator }}
          CANDIDATE_PREPARATION: ${{ inputs.candidate_preparation }}
          CONTROL_SHA: ${{ inputs.reuse_manual_artifacts && '09cdab3866d77c6ff0d007ee61b6aca3128ebe54' || inputs.candidate_control_sha || github.workflow_sha }}
        run: |
          if [ "${{ inputs.orchestrated }}" != "true" ]; then
            echo "standalone Desktop dispatch; the orchestrator approved no candidate"
          fi
          if [ -f release-control/scripts/resolve-desktop-candidate.sh ]; then
            bash release-control/scripts/resolve-desktop-candidate.sh
          else
            bash scripts/resolve-desktop-candidate.sh
          fi
          echo "artifact_prefix=desktop" >> "$GITHUB_OUTPUT"

      - name: Recover the protected manual producer artifacts
        if: ${{ inputs.reuse_manual_artifacts }}
        env:
          CONTROL_SHA: ${{ inputs.reuse_manual_artifacts && '09cdab3866d77c6ff0d007ee61b6aca3128ebe54' || inputs.candidate_control_sha || github.workflow_sha }}
        run: |
          GITHUB_RUN_ID=34816299501 GITHUB_RUN_ATTEMPT=1 node release-control/scripts/desktop-release-artifacts.mjs collect

  signing-contract:
    name: Validate signing mode
    needs: resolve
    runs-on: ubuntu-24.04
    outputs:
      verified: ${{ steps.contract.outputs.verified }}
      fingerprint: ${{ steps.contract.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/checkout@v7
        with:
          repository: bamboo-echo/Pondera
          ref: ${{ github.workflow_sha }}
          path: release-control

      - uses: ./release-control/.github/actions/setup-certum
        if: env.HAS_CERTUM == 'true'
        with:
          thumbprint: ${{ secrets.CERTUM_KEY_ID }}

      - name: Validate the checked-in signing contract
        id: contract
        env:
          IN_ORCHESTRATOR: ${{ inputs.orchestrator }}
          IN_SIGNING_PREFLIGHT: ${{ inputs.signing_preflight }}
          IN_PRODUCTION_SIGNING_SMOKE: ${{ inputs.production_signing_smoke }}
          SIGNPATH_RELEASE_SIGNING_ATTESTATION: ${{ secrets.SIGNPATH_RELEASE_SIGNING_ATTESTATION }}
        run: |
          go run ./cmd/signpath-contract validate
          fingerprint="$(go run ./cmd/signpath-contract fingerprint)"
          if [ -n "$SIGNPATH_RELEASE_SIGNING_ATTESTATION" ] && [ "$SIGNPATH_RELEASE_SIGNING_ATTESTATION" != "$fingerprint" ]; then
            echo "SIGNPATH_RELEASE_SIGNING_ATTESTATION does not match the current protected signing contract: $SIGNPATH_RELEASE_SIGNING_ATTESTATION != $fingerprint" >&2
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

  attest-signing-contract:
    name: Attest the signing contract
    needs: [resolve, signing-contract, build, windows-build, windows-sign, windows-runtime-acceptance]
    if: ${{ always() && !cancelled() && github.repository == 'bamboo-echo/Pondera' && inputs.signing_preflight && !inputs.orchestrated && needs.signing-contract.result == 'success' && needs.build.result == 'success' && needs.windows-build.result == 'success' && needs.windows-sign.result == 'success' && needs.windows-runtime-acceptance.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Attest the protected signing contract
        uses: actions/attest-build-provenance@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          subject-path: .signpath/contracts/release-signing.yml

      - name: Upload the verified contract
        uses: actions/upload-artifact@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          name: verified-contract
          path: verified-contract.json
          if-no-files-found: ignore

      - name: Record the verified contract fingerprint
        run: gh variable set SIGNPATH_RELEASE_SIGNING_ATTESTATION --body "${{ needs.signing-contract.outputs.fingerprint }}"

  mac:
    name: Build darwin-${{ matrix.arch }}
    needs: [resolve, signing-contract]
    if: ${{ needs.signing-contract.result == 'success' && !inputs.production_signing_smoke && !inputs.signing_preflight }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            arch: arm64
            runner: macos-15
          - name: darwin-amd64
            arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      APPLE_NOTARIZATION_LOG_DIR: ${{ runner.temp }}/apple-notarization
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Install workspace dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Import the Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/pondera-signing.keychain-db"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "HAS_APPLE_CERT=true" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          RELEASE_TAG: ${{ inputs.approved_cli_tag }}
        run: bash scripts/desktop-build.sh "darwin/${{ matrix.arch }}" "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.channel }}"

      - name: Checkout protected release verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control

      - name: Smoke-test packaged Electron startup
        run: node desktop/packaging/smoke.mjs "$RUNNER_TEMP/desktop-startup/Pondera.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload Apple notarization diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          name: apple-notarization-${{ matrix.name }}
          path: ${{ runner.temp }}/apple-notarization/*.json
          if-no-files-found: ignore

  mac-universal-intel:
    name: Build darwin-universal
    needs: [resolve, signing-contract]
    if: ${{ needs.signing-contract.result == 'success' && !inputs.production_signing_smoke && !inputs.signing_preflight }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Install workspace dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Build and package
        run: bash scripts/desktop-build.sh darwin/universal "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.channel }}"

      - name: Smoke-test packaged Electron startup
        run: node desktop/packaging/smoke.mjs "$RUNNER_TEMP/desktop-startup/Pondera.app"

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin-universal
          path: dist/*
          if-no-files-found: error

  linux:
    name: Build linux-${{ matrix.arch }}
    needs: [resolve, signing-contract]
    if: ${{ needs.signing-contract.result == 'success' && !inputs.production_signing_smoke && !inputs.signing_preflight }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            arch: amd64
            runner: ubuntu-24.04
          - name: linux-arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Install workspace dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build and package
        run: bash scripts/desktop-build.sh "linux/${{ matrix.arch }}" "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.channel }}"

      - name: Smoke-test packaged Electron startup
        run: xvfb-run -a node desktop/packaging/smoke.mjs

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  windows-build:
    name: Build windows-${{ matrix.arch }}
    needs: [resolve, signing-contract]
    if: ${{ needs.signing-contract.result == 'success' && !inputs.production_signing_smoke && !inputs.signing_preflight }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # runner: windows-latest, platform: windows/amd64
          - name: windows-amd64
            arch: amd64
            runner: windows-latest
          # runner: windows-11-arm, platform: windows/arm64
          - name: windows-arm64
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Install workspace dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build and package
        run: bash scripts/desktop-build.sh "windows/${{ matrix.arch }}" "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.channel }}"

      - name: Checkout protected release verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control

      - name: Smoke-test packaged Electron startup
        run: node desktop/packaging/smoke.mjs "desktop/build/electron/${{ matrix.name }}/app" --service desktop/build/bin/pondera-desktop.exe

      - name: Upload Windows signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}-windows-${{ matrix.arch }}
          path: |
            desktop/build/electron/${{ matrix.name }}/app
            desktop/build/windows/signing-payload
          if-no-files-found: error

  windows-sign:
    name: Sign the Windows payloads
    needs: [resolve, windows-build, signing-contract]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.windows-build.result == 'success' && needs.signing-contract.result == 'success' && !inputs.desktop_manual_only && github.repository == 'bamboo-echo/Pondera' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout protected release verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control

      - name: Restore both native-tested Windows payloads
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}-windows-*
          path: desktop/build
          merge-multiple: true

      - name: Require the Certum signing credentials
        if: ${{ env.HAS_CERTUM != 'true' }}
        run: |
          echo "::error::Certum credentials are required for public Windows releases"
          exit 1

      - name: Connect to Certum
        uses: ./release-control/.github/actions/setup-certum
        with:
          thumbprint: ${{ secrets.CERTUM_KEY_ID }}

      - name: Sign both payloads in the shared Certum session
        run: FINALIZE_PHASE=sign bash release-control/scripts/finalize-windows-signed-candidate.sh desktop/build/electron/windows-amd64/app amd64

      - name: Package both architectures in parallel
        run: FINALIZE_PHASE=package bash release-control/scripts/finalize-windows-signed-candidate.sh desktop/build/electron/windows-arm64/app arm64

      - name: Seal amd64 in the shared Certum session
        run: FINALIZE_PHASE=seal bash release-control/scripts/finalize-windows-signed-candidate.sh desktop/build/electron/windows-amd64/app amd64

      - name: Seal arm64 in the shared Certum session
        run: FINALIZE_PHASE=seal bash release-control/scripts/finalize-windows-signed-candidate.sh desktop/build/electron/windows-arm64/app arm64

      - name: Upload signed package size reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-size-reports
          path: dist/*.json
          if-no-files-found: ignore

      - name: Upload amd64 signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-amd64
          path: dist/*
          if-no-files-found: error

      - name: Upload arm64 signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-arm64
          path: dist/*
          if-no-files-found: error

  windows-runtime-acceptance:
    name: Accept windows-${{ matrix.arch }} startup
    needs: [resolve, windows-sign]
    if: ${{ needs.windows-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # runner: windows-latest, arch: amd64
          - name: windows-amd64
            arch: amd64
            runner: windows-latest
          # runner: windows-11-arm, arch: arm64
          - name: windows-arm64
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}-${{ matrix.name }}
          path: dist

      - name: Run Windows startup acceptance
        shell: pwsh
        run: |
          ./scripts/test-windows-installer-startup.ps1 -Installer "dist/Pondera-windows-${{ matrix.arch }}-installer.exe" -ExpectedVersion "${{ needs.resolve.outputs.version }}"
          ./scripts/test-windows-startup-recovery.ps1 -Installer "dist/Pondera-windows-${{ matrix.name }}-installer.exe"
          ./scripts/verify-windows-authenticode.ps1 -Path "dist/Pondera-windows-${{ matrix.arch }}-installer.exe"

      - name: Upload signed Windows installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-acceptance-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/pondera-installer-acceptance/**/*.json
            ${{ runner.temp }}/pondera-installer-acceptance/**/*.png
            ${{ runner.temp }}/pondera-installer-acceptance/**/*.log
            !${{ runner.temp }}/pondera-installer-acceptance/installed/**
            !${{ runner.temp }}/pondera-installer-acceptance/**/cache/**
          if-no-files-found: ignore

  build:
    name: Collect desktop artifacts
    needs: [resolve, mac, mac-universal-intel, linux, windows-sign]
    if: ${{ always() && !cancelled() && inputs.preflight_artifact_prefix == '' && needs.resolve.result == 'success' && needs.signing-contract.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}-[dlw]*
          path: dist
          merge-multiple: true

      - name: Revalidate immutable Desktop candidate
        run: bash scripts/verify-desktop-release-directory.sh dist dist

      - name: Generate the desktop manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd desktop
          go run ./cmd/sign manifest ../dist "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.tag }}"

      - name: Validate generated manifest before publication
        run: bash scripts/validate-desktop-release-manifest.sh dist

      - name: Upload the assembled desktop release
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the desktop release
    needs: [resolve, build, signing-contract, mac-universal-intel, windows-build, windows-sign, windows-runtime-acceptance]
    if: ${{ always() && !cancelled() && inputs.orchestrated && inputs.signing_preflight_verified && needs.resolve.result == 'success' && needs.signing-contract.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.preflight_artifact_prefix != '' && inputs.orchestrated && inputs.signing_preflight_verified)) && needs.build.result != 'failure' && needs.build.result != 'cancelled' && !inputs.production_signing_smoke && !inputs.signing_preflight && needs.windows-sign.result != 'failure' && needs.windows-sign.result != 'cancelled' && needs.windows-runtime-acceptance.result != 'failure' && needs.windows-runtime-acceptance.result != 'cancelled' && needs.mac-universal-intel.result != 'failure' && needs.mac-universal-intel.result != 'cancelled' && needs.windows-build.result != 'failure' && needs.windows-build.result != 'cancelled' && (inputs.preflight_artifact_prefix != '' || (needs.windows-sign.result == 'success' && needs.windows-runtime-acceptance.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Checkout protected release verifier
        uses: actions/checkout@v7
        with:
          repository: bamboo-echo/Pondera
          ref: ${{ github.workflow_sha }}
          path: release-control

      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: assets

      - name: Revalidate immutable Desktop candidate
        run: bash release-control/scripts/resolve-desktop-candidate.sh "${{ needs.resolve.outputs.tag }}"

      - name: Sign artifacts (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: bash release-control/scripts/sign-desktop-artifacts.sh dist

      - name: Verify artifact signatures and recover the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          signature_verifier="$RUNNER_TEMP/pondera-sign"
          go -C release-control/desktop build -o "$signature_verifier" ./cmd/sign
          verify_signature_directory() { "$signature_verifier" verify "$1"/*.minisig; }
          verify_signature_directory assets
          existing_directory="$RUNNER_TEMP/existing"
          mkdir -p "$existing_directory"
          gh release download "${{ needs.resolve.outputs.tag }}" -R "${{ github.repository }}" --dir "$existing_directory" 2>/dev/null || true
          verify_signature_directory "$existing_directory"
          if [ -f "$existing_directory/latest.json" ]; then
            cp "$existing_directory/latest.json" assets/latest.json
          fi
          bash release-control/scripts/verify-desktop-release-directory.sh --allow-authenticated-payload-differences assets "$existing_directory"

      - name: Download orchestrator-reviewed release notes
        if: ${{ !inputs.orchestrated }}
        uses: actions/download-artifact@v4
        with:
          name: orchestrator-reviewed-release-notes
          path: release-notes

      - name: Verify complete signed artifact handoff
        run: node release-control/scripts/desktop-release-artifacts.mjs collect

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.approved_cli_tag }}
        run: |
          bash release-control/scripts/publish-desktop-github-release.sh \
            "${{ needs.resolve.outputs.tag }}" \
            "${{ needs.resolve.outputs.version }}" \
            "${{ inputs.prerelease }}" \
            release-notes/notes.md \
            assets

      - name: Attach desktop manifest to matching CLI release
        if: ${{ !inputs.desktop_manual_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "attach latest.json to the matching CLI release"

      - name: Disclose manual Desktop distribution
        if: ${{ inputs.desktop_manual_only }}
        env:
          MANUAL_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          version="v${MANUAL_VERSION#v}"
          bash scripts/manual-desktop-exception.sh validate "${{ needs.resolve.outputs.tag }}"
          echo "This ${version} desktop release is manual-download only."

  mirror:
    name: Mirror the desktop release to R2
    needs: [resolve, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/checkout@v7
        with:
          repository: bamboo-echo/Pondera
          ref: ${{ github.workflow_sha }}
          path: release-control

      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: assets

      - name: Require R2 for Preview
        if: ${{ inputs.channel == 'preview' && env.HAS_R2 != 'true' }}
        env:
          HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
        run: |
          echo "Preview publication requires R2 credentials" >&2
          exit 1

      - name: Validate R2 manifest before upload
        run: bash release-control/scripts/compare-desktop-release-manifests.sh assets/latest.json assets/latest.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto
          endpoint-url: ${{ secrets.R2_ENDPOINT }}

      - name: Mirror immutable assets and advance R2 pointer
        id: mirror_r2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DESKTOP_MANUAL_ONLY: ${{ inputs.desktop_manual_only }}
          RELEASE_TAG: ${{ inputs.approved_cli_tag }}
        run: |
          if [ "$DESKTOP_MANUAL_ONLY" = "true" ]; then
            pointer_moved=false
            echo "manual release keeps both public pointers unchanged"
            echo "pointer_moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pointer_moved=false
          validate_current_pointer() {
            echo "validating the current R2 pointer"
          }
          download_optional() {
            aws s3 cp "s3://${R2_BUCKET}/$1" "/tmp/pondera-desktop-$(basename "$(dirname "$1")")-latest.json" 2>/dev/null || true
          }
          download_optional "preview/latest.json"
          download_optional "canary/latest.json"
          if cmp -s /tmp/pondera-desktop-canary-latest.json /tmp/pondera-desktop-preview-latest.json; then
            echo "canary and preview pointers already agree"
          fi
          current_channel="stable"
          current_version="${{ needs.resolve.outputs.version }}"
          current_base="cli/${current_channel}/latest.json"
          legacy_preview_base="cli/preview/latest.json"
          if bash release-control/scripts/decide-desktop-pointer-update.sh "legacy-${current_channel}" "$current_version" "$current_base"; then
            pointer_moved=true
          fi
          if bash release-control/scripts/decide-desktop-pointer-update.sh legacy-preview "$current_version" "$legacy_preview_base"; then
            pointer_moved=true
          fi
          publish_pointer canary
          publish_pointer preview
          for payload in assets/*; do
            payload_relative="$(basename "$payload")"
            cp "$payload" "assets/$payload_relative"
          done
          for signature in assets/*.minisig; do
            relative="$(basename "$signature")"
            cp "$signature" "assets/$relative"
          done
          bash release-control/scripts/verify-desktop-release-manifest-assets.sh assets/latest.json assets
          bash release-control/scripts/verify-desktop-release-directory.sh assets assets
          published_directory="$RUNNER_TEMP/published"
          mkdir -p "$published_directory"
          verify_signature_directory "$published_directory"
          echo "pointer_moved=$pointer_moved" >> "$GITHUB_OUTPUT"

      - name: Report the pointer decision
        if: ${{ steps.mirror_r2.outputs.pointer_moved == 'true' }}
        run: echo "the public pointer advanced to the new manifest"
