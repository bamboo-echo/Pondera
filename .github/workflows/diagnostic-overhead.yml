name: Diagnostic overhead

# Measures Electron and frontend diagnostic overhead on packaging changes.

on:
  pull_request:
    paths:
      - "desktop/electron/**"
      - "desktop/frontend/**"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overhead:
    name: Measure diagnostic overhead
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Install workspace dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Measure the diagnostic overhead
        working-directory: desktop
        run: node electron/scripts/performance-benchmark.mjs

      - name: Upload the overhead evidence
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-overhead
          path: desktop/electron/diagnostic-overhead/**
          if-no-files-found: error
