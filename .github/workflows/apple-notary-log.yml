name: Apple notary log

# Reads one notarization submission log from Apple. This workflow never submits,
# signs or staples anything; it only runs from the protected release branch.

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "notarytool submission identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  log:
    name: Download the notarization log
    if: ${{ github.ref == 'refs/heads/main-v2' && github.ref_protected }}
    environment: release
    runs-on: macos-14
    steps:
      - name: Read the submission log
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$SUBMISSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            :
          else
            echo "invalid submission id" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/apple-notary-key.$$.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          mkdir -p "$RUNNER_TEMP/apple-notarization"
          xcrun notarytool info "$SUBMISSION_ID" --key "$key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" > "$RUNNER_TEMP/apple-notarization/info.json"
          xcrun notarytool log "$SUBMISSION_ID" --key "$key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" "$RUNNER_TEMP/apple-notarization/notary-log.json"

      - name: Upload the notarization log
        if: always()
        uses: actions/upload-artifact@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          name: apple-notary-log
          path: ${{ runner.temp }}/apple-notarization/*.json
          if-no-files-found: ignore
