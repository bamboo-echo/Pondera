version: 2

project_name: pondera

builds:
  - id: pondera
    main: ./cmd/pondera
    binary: pondera
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X pondera/internal/productdocs.linkedVersion={{ .Tag }}
      - -X pondera/internal/productdocs.linkedRevision={{ .Commit }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: pondera-{{ .Os }}-{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

homebrew_casks:
  - name: pondera
    repository:
      owner: bamboo-echo
      name: homebrew-pondera
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/bamboo-echo/Pondera
    description: Cache-first DeepSeek coding agent for the terminal
    binaries:
      - pondera
    # The CLI is not notarized yet; Homebrew's current postflight_steps stanza
    # strips the quarantine attribute so the cask can run.
    postflight_steps do
      system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pondera"]
    end

release:
  draft: false
  prerelease: auto
  name_template: "Pondera CLI {{ .Tag }}"
  extra_files:
    - glob: dist/latest.json
