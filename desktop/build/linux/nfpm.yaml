# nfpm config for the Linux .deb package. scripts/desktop-build.sh's linux branch
# runs `nfpm package` after the Electron packaging step, from the desktop/ dir
# (so the src paths below are relative to desktop/). Portable clients keep using
# the .tar.gz under platforms[]; this .deb is the native package channel
# (native_packages) and also remains a human-download artifact.
#
# $DEB_VERSION and $DEB_ARCH are exported by desktop-build.sh. DEB_VERSION follows
# Debian version ordering: stable X.Y.Z, prereleases as X.Y.Z~rc.N / X.Y.Z~canary.N
# so they sort below the matching stable package. DEB_ARCH is the Go arch name,
# which already matches Debian's (amd64, arm64).
name: "pondera-desktop"
arch: "${DEB_ARCH}"
platform: "linux"
version: "${DEB_VERSION}"
section: "utils"
priority: "optional"
maintainer: "Pondera Contributors"
description: |
  Pondera desktop — an Electron shell around the Go kernel.
vendor: "Pondera Contributors"
homepage: "https://github.com/esengine/DeepSeek-Pondera"
license: "MIT"
deb:
  compression: xz
scripts:
  postinstall: ./build/linux/postinstall.sh
# Runtime libraries the bundled Chromium links against at runtime; apt pulls
# them in on install. These package names ship from Ubuntu 22.04 / Debian 12 on.
# pkexec is required for the in-app Polkit authorization update path.
depends:
  - libgtk-3-0
  - libnss3
  - libgbm1
  - libasound2
  - pkexec
contents:
  - src: ./build/bin/pondera-desktop
    dst: /usr/bin/pondera-desktop
    file_info:
      mode: 0755
  - src: ./build/bin/pondera-launcher
    dst: /usr/bin/pondera-launcher
    file_info:
      mode: 0755
  - src: ./build/bin/pondera
    dst: /usr/bin/pondera
    file_info:
      mode: 0755
  - src: ./build/bin/pondera-update-helper
    dst: /usr/lib/pondera/pondera-update-helper
    file_info:
      mode: 0755
  # The Electron bundle (Pondera executable, chrome-sandbox, resources),
  # staged at build/bin/app by desktop-build.sh. The service bootstrap starts
  # app/Pondera from here; postinstall.sh sets the chrome-sandbox helper
  # setuid-root (4755) so the renderer sandbox works without --no-sandbox.
  - src: ./build/bin/app
    dst: /usr/lib/pondera/app
    type: tree
  - src: ./build/linux/io.pondera.desktop.update.policy
    dst: /usr/share/polkit-1/actions/io.pondera.desktop.update.policy
    file_info:
      mode: 0644
  - src: ./build/linux/pondera.desktop
    dst: /usr/share/applications/pondera.desktop
    file_info:
      mode: 0644
  # appicon.png is 1024x1024 — not a standard hicolor size dir, so install it under
  # the size-agnostic pixmaps path that the .desktop's `Icon=pondera-desktop` finds.
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/16x16/apps/pondera-desktop.png
    dst: /usr/share/icons/hicolor/16x16/apps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/24x24/apps/pondera-desktop.png
    dst: /usr/share/icons/hicolor/24x24/apps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/32x32/apps/pondera-desktop.png
    dst: /usr/share/icons/hicolor/32x32/apps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/48x48/apps/pondera-desktop.png
    dst: /usr/share/icons/hicolor/48x48/apps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/64x64/apps/pondera-desktop.png
    dst: /usr/share/icons/hicolor/64x64/apps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/128x128/apps/pondera-desktop.png
    dst: /usr/share/icons/hicolor/128x128/apps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/256x256/apps/pondera-desktop.png
    dst: /usr/share/icons/hicolor/256x256/apps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/512x512/apps/pondera-desktop.png
    dst: /usr/share/icons/hicolor/512x512/apps/pondera-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/scalable/apps/pondera-desktop.svg
    dst: /usr/share/icons/hicolor/scalable/apps/pondera-desktop.svg
    file_info:
      mode: 0644
